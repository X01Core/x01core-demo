<!doctype html>
<html lang="zh-cn">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>X01Core</title>
    <style>
        :root {
            --bg1: #0b1020;
            --accent: #00e6ff
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, system-ui, Segoe UI, Arial;
        }

        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(ellipse at 10% 10%, #071425 0%, #0b0b1a 35%, #120a28 100%);
            color: #fff
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        .layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 40px;
            pointer-events: none;
        }

        .neon {
            font-weight: 800;
            letter-spacing: 0.12em;
            display: inline-block;
            padding: 18px 36px;
            border-radius: 12px;
            color: var(--accent);
            font-size: clamp(48px, 9vw, 140px);
            transform-style: preserve-3d;
        }

        .neon span {
            display: inline-block;
            padding: 0 2px;
            text-shadow: 0 0 8px rgba(0, 230, 255, 0.5);
            animation: float 3s ease-in-out infinite
        }

        @keyframes float {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-6px)
            }

            100% {
                transform: translateY(0)
            }
        }

        .neon span:nth-child(odd) {
            filter: drop-shadow(0 0 18px rgba(0, 230, 255, 0.55))
        }

        .ring {
            position: absolute;
            left: auto;
            top: auto;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            filter: blur(10px);
            opacity: 0.9;
            background: conic-gradient(from 0deg, rgba(0, 230, 255, 0.1), rgba(180, 0, 255, 0.1), rgba(0, 230, 255, 0.1))
        }

        .pointer {
            position: fixed;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 18px rgba(0, 230, 255, 0.9);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 3;
            opacity: 0;
        }

        .footer {
            position: fixed;
            bottom: 12px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.18);
            font-size: 12px;
            z-index: 3
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>
    <div class="ring" aria-hidden="true"></div>
    <div class="layer">
        <h1 class="neon" id="name">X01Core</h1>
    </div>
    <div class="pointer" id="pointer"></div>
    <div class="footer">移动鼠标 / 点击 / 按 空格 键 可产生额外粒子</div>

    <script>
        (function () {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');
            let w = canvas.width = innerWidth;
            let h = canvas.height = innerHeight;
            const particles = [];
            const mouse = { x: w / 2, y: h / 2, down: false };
            const pointerEl = document.getElementById('pointer');
            if (pointerEl) pointerEl.style.transform = `translate(${mouse.x}px,${mouse.y}px) translate(-50%,-50%)`;

            function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight }
            addEventListener('resize', resize);

            function rand(a, b) { return Math.random() * (b - a) + a }

            function spawn(x, y, n) {
                for (let i = 0; i < n; i++) { particles.push({ x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-2, 2), vy: rand(-2, 2), r: rand(1, 4), life: rand(60, 140), h: rand(180, 220) }) }
                if (particles.length > 1200) particles.splice(0, particles.length - 900);
            }

            addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; if (pointerEl) pointerEl.style.transform = `translate(${mouse.x}px,${mouse.y}px) translate(-50%,-50%)`; spawn(mouse.x, mouse.y, 2) });
            addEventListener('mousedown', () => { mouse.down = true; spawn(mouse.x, mouse.y, 80) });
            addEventListener('mouseup', () => mouse.down = false);
            addEventListener('keydown', e => { if (e.code === 'Space') { for (let i = 0; i < 200; i++) spawn(mouse.x, mouse.y, 1); document.body.animate([{ filter: 'brightness(1.8)' }, { filter: 'brightness(1)' }], { duration: 600, easing: 'ease-out' }) } });

            function update() { for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.vx += (Math.cos((p.x + performance.now() / 50) * 0.01) * 0.05); p.vy += (Math.sin((p.y + performance.now() / 50) * 0.01) * 0.05) + 0.02; p.x += p.vx; p.y += p.vy; p.life--; if (p.life <= 0 || p.x < -50 || p.x > w + 50 || p.y < -50 || p.y > h + 50) particles.splice(i, 1) } }

            function draw() {
                ctx.clearRect(0, 0, w, h); const g = ctx.createLinearGradient(0, 0, w, h); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
                for (const p of particles) { ctx.beginPath(); ctx.fillStyle = `hsla(${p.h},90%,60%,${Math.max(0, p.life / 140)})`; ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowColor = `hsla(${p.h},90%,60%,0.6)`; ctx.shadowBlur = p.r * 6 } ctx.shadowBlur = 0
            }

            (function loop() { update(); draw(); requestAnimationFrame(loop) })();


            const nameEl = document.getElementById('name');
            const text = nameEl.textContent.trim();
            nameEl.innerHTML = text.split('').map((ch, i) => `<span style="display:inline-block;animation:pop 1.8s ease-in-out ${i * 80}ms infinite">${ch}</span>`).join('');
            const style = document.createElement('style');
            style.textContent = '@keyframes pop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.06)}100%{transform:translateY(0) scale(1)}}';
            document.head.appendChild(style);


            const ringEl = document.querySelector('.ring');
            function updateReference() {
                const r = nameEl.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;
                // 将环定位到元素中心（使用 left/top + translate(-50%,-50%) 保持居中）
                ringEl.style.left = cx + 'px';
                ringEl.style.top = cy + 'px';
                // 确保首次渲染时环已经居中，避免在用户第一次移动鼠标前出现偏移
                ringEl.style.transform = 'translate(-50%,-50%) rotate(0deg)';
                return { cx, cy, rw: r.width, rh: r.height };
            }
            let ref = updateReference();
            addEventListener('resize', () => ref = updateReference());

            addEventListener('mousemove', e => {
                const dx = (e.clientX - ref.cx) / ref.rw * 24; // 根据元素宽度归一化并放大
                const dy = (e.clientY - ref.cy) / ref.rh * 24;
                nameEl.style.transform = `perspective(900px) rotateY(${dx}deg) rotateX(${-dy}deg)`;
                // 让环的旋转也围绕元素中心更有连贯性
                const rel = (e.clientX - ref.cx) / ref.rw;
                ringEl.style.transform = `translate(-50%,-50%) rotate(${rel * 360}deg)`;
            });
        })();
    </script>
</body>

</html>
